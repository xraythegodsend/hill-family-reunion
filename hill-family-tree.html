<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>The Hill Family Tree</title>
<style>
  :root {
    --bg: #fafafa; --text: #222; --muted: #555; --border: #999; --accent: #f0ad4e;
    --male: #dbe9f6; --male-border: #5b8fc7; --female: #f7dbe6; --female-border: #c76b95;
    --neutral: #eaeaea; --neutral-border: #888; --glow: #ffc400;
    --btn-bg: #fff; --btn-border: #ccc; --btn-hover-bg: #f0f0f0; --btn-text: #222;
    --toggle-bg: #fff; --toggle-border: #888; --toggle-hover-bg: #eef4fb;
    --toggle-hover-border: #5b8fc7; --toggle-label: #555;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1e1e1e; --text: #eee; --muted: #bbb;
      --btn-bg: #333; --btn-border: #555; --btn-hover-bg: #444; --btn-text: #eee;
      --toggle-bg: #2a2a2a; --toggle-hover-bg: #333; --toggle-hover-border: #7fb0e6;
      --toggle-label: #ccc;
    }
  }
  body { margin: 0; font-family: -apple-system, Segoe UI, Arial, sans-serif; background: var(--bg); }
  .toolbar { display: flex; align-items: center; gap: 16px; padding: 20px 28px 4px; flex-wrap: wrap; }
  h1 { font-size: 18px; margin: 0; color: var(--text); flex: 1; }
  .zoom-controls { display: flex; gap: 10px; flex-wrap: wrap; }
  .zoom-controls button {
    font-size: 20px; min-width: 52px; height: 52px; padding: 0 20px; border-radius: 10px;
    border: 1px solid var(--btn-border); background: var(--btn-bg); color: var(--btn-text);
    cursor: pointer;
  }
  .zoom-controls button:hover { background: var(--btn-hover-bg); }
  .tree-wrap {
    width: 100%; height: calc(100vh - 76px); overflow: auto; padding: 16px; box-sizing: border-box;
    display: flex; justify-content: center; align-items: flex-start;
  }
  svg { display: block; transform-origin: 0 0; flex-shrink: 0; }
  .name { font-size: 13px; font-weight: 600; fill: var(--text); }
  .years { font-size: 11px; fill: var(--muted); }
  .sex-m rect { fill: var(--male); stroke: var(--male-border); stroke-width: 1.5; }
  .sex-f rect { fill: var(--female); stroke: var(--female-border); stroke-width: 1.5; }
  .sex-u rect { fill: var(--neutral); stroke: var(--neutral-border); stroke-width: 1.5; }
  .person { cursor: pointer; }
  .union-line { stroke: var(--border); stroke-width: 1.5; }
  .descent-line {
    stroke: var(--border); stroke-width: 1.5; fill: none;
    transition: stroke 0.15s ease, stroke-width 0.15s ease;
  }
  .union-dot { fill: var(--border); }
  .cluster-box { fill: var(--accent); fill-opacity: 0.08; stroke: var(--accent); stroke-opacity: 0.5; stroke-width: 1.5; stroke-dasharray: 6,4; }
  .toggle { cursor: pointer; }
  .toggle-circle { fill: var(--toggle-bg); stroke: var(--toggle-border); stroke-width: 1.5; }
  .toggle:hover .toggle-circle { fill: var(--toggle-hover-bg); stroke: var(--toggle-hover-border); }
  .toggle-label { font-size: 13px; font-weight: 700; fill: var(--toggle-label); user-select: none; }
  /* Clicking a person glows the lines running to their own children (see highlightChildren)
     so the eye can trace the connection at a glance, without any of it depending on theme
     colors - a deliberately fixed gold regardless of the color scheme in use. */
  .descent-group.glow .descent-line {
    stroke: var(--glow); stroke-width: 3.5;
    filter: drop-shadow(0 0 3px var(--glow));
  }
</style>
<style>
/* Hill Family Reunion theme for render_explorer.py's output.
   Matches the palette and type system of hill-family-reunion.html so the embedded explorer
   reads as part of the same site rather than a bolted-on tool. Commits to the reunion site's
   single dark look rather than adapting to the viewer's OS theme, since the reunion page
   itself doesn't offer a light mode. */

@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Raleway:wght@300;400;500;600&display=swap');

:root {
  --bg: #062828;
  --card-bg: #0A3D3A;
  --text: #E8F8F5;
  --muted: #1AA89A;
  --border: rgba(72,202,228,0.25);
  --accent: #FF6B35;
  --male: rgba(26,168,154,0.16);
  --male-border: #1AA89A;
  --female: rgba(255,107,53,0.16);
  --female-border: #FF6B35;
  --neutral: rgba(255,255,255,0.06);
  --neutral-border: rgba(255,255,255,0.3);
}

body {
  font-family: 'Libre Baskerville', serif;
}

.toolbar {
  padding: 20px 24px 12px;
  border-bottom: 1px solid var(--border);
}

h1 {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 300;
  font-size: 1.7rem;
  letter-spacing: 0.02em;
  color: #FFFFFF;
}

.breadcrumb {
  font-family: 'Raleway', sans-serif;
  font-size: 0.72rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
.breadcrumb button {
  color: var(--muted);
}
.breadcrumb button:hover {
  background: rgba(255,107,53,0.1);
  color: var(--accent);
}
.breadcrumb button.current {
  color: var(--accent);
}
.breadcrumb button.current:hover {
  background: none;
}

.focus-card {
  border-radius: 2px;
  border: 1px solid var(--border);
  position: relative;
  overflow: hidden;
  padding: 28px 28px 24px;
}
.focus-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 3px;
  background: var(--accent);
}

.person-name {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 400;
  font-size: 1.7rem;
  color: #FFFFFF;
}
.person-years, .spouse-detail {
  font-family: 'Raleway', sans-serif;
  letter-spacing: 0.08em;
}
.maiden-name {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 0.95rem;
}
.conf-flag {
  font-family: 'Raleway', sans-serif;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  font-size: 0.68rem;
  color: var(--accent);
}

.spouse-row {
  border-top: 1px solid var(--border);
}
.spouse-row::before {
  color: var(--accent);
}
.spouse-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.15rem;
  font-weight: 400;
  color: #FFFFFF;
}

.notes {
  font-family: 'Libre Baskerville', serif;
  font-style: italic;
  line-height: 1.7;
  color: var(--text);
  opacity: 0.85;
}

.section-title {
  font-family: 'Raleway', sans-serif;
  font-size: 0.7rem;
  letter-spacing: 0.3em;
  color: var(--accent);
  display: flex;
  align-items: center;
  gap: 14px;
}
.section-title::after {
  content: '';
  flex: 1;
  max-width: 60px;
  height: 1px;
  background: var(--accent);
  opacity: 0.4;
}

.child-row {
  border-radius: 2px;
  background: rgba(255,255,255,0.02);
  transition: border-color 0.2s ease, background 0.2s ease, transform 0.2s ease;
}
.child-row:hover {
  background: rgba(255,107,53,0.08);
  transform: translateY(-1px);
}
.child-row .info {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.05rem;
  color: var(--text);
}
.branch-icon {
  color: var(--accent);
}
.child-row .chevron {
  color: var(--muted);
}

.empty-msg {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
}

.root-picker .child-row {
  border-color: rgba(255,184,48,0.4);
}

/* ===== render_tree.py (the full SVG diagram) ===== */

.zoom-controls button {
  font-family: 'Raleway', sans-serif;
  font-size: 0.68rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  border-radius: 2px;
  border-color: var(--border);
}
.zoom-controls button:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.name {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 400;
  font-size: 15px;
}
.years {
  font-family: 'Raleway', sans-serif;
  letter-spacing: 0.06em;
}

.sex-m rect, .sex-f rect, .sex-u rect {
  stroke-width: 1.25;
}

.toggle-circle {
  stroke-width: 1.25;
}
.toggle-label {
  font-family: 'Raleway', sans-serif;
}

</style>
</head>

<script>
  var zoom = 1;
  var svg = document.getElementById('tree-svg');
  var canvas = document.getElementById('canvas');
  var baseW = 3455.0, baseH = 12320.0;
  var defaultOpenIds = ['u_isabell_hill_1877_sheppard_maxwell','u_john_l_cain_sarah_hill_1870','u_angie_parland_charley_fisher_hill_1871','u_rosa_hill_1882_walter_everette','u_myers_hill_1883_onie_miller','u_henry_way_lillie_hill_1877','u_george_mitchell_lillie_hill_1877','u_aaron_hill_1838_mary_ann_pinckney_1848'];

  function setZoom(z) {
    zoom = Math.max(0.15, Math.min(4, z));
    svg.style.transform = 'scale(' + zoom + ')';
    // The transform above only changes how the SVG paints, not its layout size — resize the
    // plain wrapper div instead so the scroll container actually knows how much room the
    // zoomed-in content needs (a transform alone wouldn't grow the scrollable area).
    canvas.style.width = (baseW * zoom) + 'px';
    canvas.style.height = (baseH * zoom) + 'px';
  }
  // Start zoomed to fit the window width, since the natural size is usually much wider than
  // the screen — native-size (100%) is one button click away via the Reset button.
  setZoom(Math.min(1, (window.innerWidth - 48) / baseW));

  function highlightChildren(pid, evt) {
    if (evt) evt.stopPropagation();
    document.querySelectorAll('.descent-group.glow').forEach(function(g) {
      g.classList.remove('glow');
    });
    document.querySelectorAll('.descent-group').forEach(function(g) {
      var ids = (g.getAttribute('data-parent-ids') || '').split(',');
      if (ids.indexOf(pid) !== -1) g.classList.add('glow');
    });
  }

  function toggleSubtree(ids, toggleEl) {
    var firstGroup = document.getElementById(ids[0]);
    var nowOpen = !firstGroup || firstGroup.style.display === 'none';
    ids.forEach(function(id) {
      var g = document.getElementById(id);
      if (g) g.style.display = nowOpen ? 'block' : 'none';
    });
    var label = toggleEl.querySelector('.toggle-label');
    if (label) label.textContent = nowOpen ? '−' : '+';
  }

  function setAllSubtrees(open) {
    document.querySelectorAll('.subtree').forEach(function(g) {
      g.style.display = open ? 'block' : 'none';
    });
    document.querySelectorAll('.toggle .toggle-label').forEach(function(label) {
      label.textContent = open ? '−' : '+';
    });
  }

  function expandAll() { setAllSubtrees(true); }

  function collapseAll() {
    // "Collapse all" returns to the tree's original default view (a couple of generations
    // open) rather than closing every single branch, which would just show the root couple.
    document.querySelectorAll('.subtree').forEach(function(g) {
      g.style.display = defaultOpenIds.indexOf(g.id) !== -1 ? 'block' : 'none';
    });
    document.querySelectorAll('.toggle').forEach(function(t) {
      var ids = t.getAttribute('data-ids').split(',');
      var open = ids.some(function(id) { return defaultOpenIds.indexOf(id) !== -1; });
      var label = t.querySelector('.toggle-label');
      if (label) label.textContent = open ? '−' : '+';
    });
  }
</script>
