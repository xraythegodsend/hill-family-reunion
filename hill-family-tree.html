<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Hill Family Tree</title>
<style>

:root{
  --bg:#f6f6f7; --card-bg:#fff; --text:#17171a; --muted:#6c6c73; --border:#d6d6db;
  --accent:#c1782f; --glow:#ffc400;
  --male:#dbe9f6; --male-border:#5b8fc7;
  --female:#f7dbe6; --female-border:#c76b95;
  --neutral:#e9e9ec; --neutral-border:#8d8d92;
  --btn-bg:#fff; --btn-border:#c9c9cf; --btn-hover-bg:#eeeef0; --btn-text:#17171a;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#151517; --card-bg:#232327; --text:#ededf0; --muted:#a2a2a9; --border:#3b3b41;
    --neutral:#2b2b30; --neutral-border:#8d8d92;
    --btn-bg:#292930; --btn-border:#474750; --btn-hover-bg:#34343c; --btn-text:#ededf0;
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);
     font-family:-apple-system,'Segoe UI',Arial,sans-serif;overflow:hidden}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
         padding:10px 18px;border-bottom:1px solid var(--border)}
h1{font-size:17px;margin:0 14px 0 0;flex:1;min-width:170px}
.controls{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.controls button{font-size:13.5px;min-height:40px;padding:0 13px;border-radius:8px;
  border:1px solid var(--btn-border);background:var(--btn-bg);color:var(--btn-text);cursor:pointer}
.controls button:hover{background:var(--btn-hover-bg)}
.controls button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.zlabel{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;min-width:50px;text-align:center}
.hint{font-size:12.5px;color:var(--muted);padding:6px 18px;border-bottom:1px solid var(--border)}
.hint b{color:var(--text);font-weight:600}
#warn{display:none;padding:8px 18px;background:#8a1c1c;color:#fff;font-size:13px}
#scroll{position:absolute;inset:0;top:var(--chrome,104px);overflow:auto;cursor:grab}
#scroll.drag{cursor:grabbing}
svg{display:block}

.ln{stroke:var(--border);stroke-width:1.6;fill:none}
.cbox{fill:var(--card-bg);stroke:var(--neutral-border);stroke-width:1.5}
.rowdiv{stroke:var(--border);stroke-width:1}
.chip{fill:var(--neutral-border)}
.chip.sx-m{fill:var(--male-border)} .chip.sx-f{fill:var(--female-border)}
.nm{font-size:13px;fill:var(--text)}
.nm.blood{font-weight:650}
.yr{font-size:11px;fill:var(--muted)}
.grplabel rect{fill:var(--bg);stroke:var(--border);stroke-width:1}
.grplabel text{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;fill:var(--muted)}

.node{cursor:pointer}
.node:hover .cbox{stroke:var(--accent)}
.node.focused .cbox{stroke:var(--glow);stroke-width:3;filter:drop-shadow(0 3px 14px rgba(0,0,0,.35))}
.node.focused .nm{font-size:15px}
.node.focused .yr{font-size:12.5px}
.node.ancestor .cbox{stroke:var(--glow);stroke-width:2.2}
.link.lit .ln{stroke:var(--glow);stroke-width:3.2}
.link.lit .grplabel rect{stroke:var(--glow)}
.link.lit .grplabel text{fill:var(--glow)}

.tog{cursor:pointer}
.tog rect,.tog circle{fill:var(--bg);stroke:var(--neutral-border);stroke-width:1.5}
.tog:hover rect,.tog:hover circle{stroke:var(--accent)}
.tog text{font-size:11px;font-weight:700;fill:var(--muted);
          text-anchor:middle;dominant-baseline:middle;user-select:none}
.tog.shut rect{fill:var(--accent);stroke:var(--accent)}
.tog.shut text{fill:#fff}

/* Zoomed out, text would be sub-pixel mush - it drops away so the chart reads as the shape
   of the family rather than a smear. */
svg.lod0 .nm,svg.lod0 .yr,svg.lod0 .grplabel,svg.lod0 .rowdiv,svg.lod0 .tog{display:none}
svg.lod1 .grplabel,svg.lod1 .yr{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

</style>
<style>
/* Hill Family Reunion theme for render_explorer.py's output.
   Matches the palette and type system of hill-family-reunion.html so the embedded explorer
   reads as part of the same site rather than a bolted-on tool. Commits to the reunion site's
   single dark look rather than adapting to the viewer's OS theme, since the reunion page
   itself doesn't offer a light mode. */

@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Raleway:wght@300;400;500;600&display=swap');

:root {
  --bg: #062828;
  --card-bg: #0A3D3A;
  --text: #E8F8F5;
  --muted: #1AA89A;
  --border: rgba(72,202,228,0.25);
  --accent: #FF6B35;
  --male: rgba(26,168,154,0.16);
  --male-border: #1AA89A;
  --female: rgba(255,107,53,0.16);
  --female-border: #FF6B35;
  --neutral: rgba(255,255,255,0.06);
  --neutral-border: rgba(255,255,255,0.3);
}

body {
  font-family: 'Libre Baskerville', serif;
}

.toolbar {
  padding: 20px 24px 12px;
  border-bottom: 1px solid var(--border);
}

h1 {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 300;
  font-size: 1.7rem;
  letter-spacing: 0.02em;
  color: #FFFFFF;
}

.breadcrumb {
  font-family: 'Raleway', sans-serif;
  font-size: 0.72rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
.breadcrumb button {
  color: var(--muted);
}
.breadcrumb button:hover {
  background: rgba(255,107,53,0.1);
  color: var(--accent);
}
.breadcrumb button.current {
  color: var(--accent);
}
.breadcrumb button.current:hover {
  background: none;
}

.focus-card {
  border-radius: 2px;
  border: 1px solid var(--border);
  position: relative;
  overflow: hidden;
  padding: 28px 28px 24px;
}
.focus-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 3px;
  background: var(--accent);
}

.person-name {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 400;
  font-size: 1.7rem;
  color: #FFFFFF;
}
.person-years, .spouse-detail {
  font-family: 'Raleway', sans-serif;
  letter-spacing: 0.08em;
}
.maiden-name {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 0.95rem;
}
.conf-flag {
  font-family: 'Raleway', sans-serif;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  font-size: 0.68rem;
  color: var(--accent);
}

.spouse-row {
  border-top: 1px solid var(--border);
}
.spouse-row::before {
  color: var(--accent);
}
.spouse-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.15rem;
  font-weight: 400;
  color: #FFFFFF;
}

.notes {
  font-family: 'Libre Baskerville', serif;
  font-style: italic;
  line-height: 1.7;
  color: var(--text);
  opacity: 0.85;
}

.section-title {
  font-family: 'Raleway', sans-serif;
  font-size: 0.7rem;
  letter-spacing: 0.3em;
  color: var(--accent);
  display: flex;
  align-items: center;
  gap: 14px;
}
.section-title::after {
  content: '';
  flex: 1;
  max-width: 60px;
  height: 1px;
  background: var(--accent);
  opacity: 0.4;
}

.child-row {
  border-radius: 2px;
  background: rgba(255,255,255,0.02);
  transition: border-color 0.2s ease, background 0.2s ease, transform 0.2s ease;
}
.child-row:hover {
  background: rgba(255,107,53,0.08);
  transform: translateY(-1px);
}
.child-row .info {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.05rem;
  color: var(--text);
}
.branch-icon {
  color: var(--accent);
}
.child-row .chevron {
  color: var(--muted);
}

.empty-msg {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
}

.root-picker .child-row {
  border-color: rgba(255,184,48,0.4);
}

/* ===== render_tree.py (the full SVG diagram) ===== */

.zoom-controls button {
  font-family: 'Raleway', sans-serif;
  font-size: 0.68rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  border-radius: 2px;
  border-color: var(--border);
}
.zoom-controls button:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.name {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 400;
  font-size: 15px;
}
.years {
  font-family: 'Raleway', sans-serif;
  letter-spacing: 0.06em;
}

.sex-m rect, .sex-f rect, .sex-u rect {
  stroke-width: 1.25;
}

.toggle-circle {
  stroke-width: 1.25;
}
.toggle-label {
  font-family: 'Raleway', sans-serif;
}

</style>
</head>
<body>
<div class="toolbar">
  <h1>The Hill Family Tree</h1>
  <div class="controls">
    <button type="button" onclick="fit()">Fit whole tree</button>
    <button type="button" onclick="goRoot()">Founding couple</button>
    <button type="button" onclick="isolate()">Isolate this line</button>
    <button type="button" onclick="expandAll()">Expand all</button>
    <button type="button" onclick="collapseAll()">Collapse all</button>
    <button type="button" onclick="nudge(-1)">&minus;</button>
    <span class="zlabel" id="zl">100%</span>
    <button type="button" onclick="nudge(1)">+</button>
  </div>
</div>
<div class="hint">Click a couple to zoom in and light up their line back to the founding couple. Click a <b>&minus;</b> under any couple to fold that branch away, or <b>Isolate this line</b> to fold everything else. Drag to pan, Ctrl/&#8984;+scroll to zoom.</div>

const ROOTS = ["aaron_hill_1838"];
const ROW_H = 210, PAD = 30, MARGIN = 160;

const svg = document.getElementById('svg');
const scroll = document.getElementById('scroll');
const collapsed = new Set();
let zoom = 1, focused = null, POS = {}, VIS = new Set(), BW = 1, BH = 1;

const kidsOf = id => collapsed.has(id) ? [] : N[id].k;

/* ---- layout: two passes, extents not widths (see the module docstring) ---- */
function computeLayout(){
  const L={}, R={}, offs={}, order=[];
  for(const r of ROOTS){
    const st=[[r,false]];
    while(st.length){
      const [n,done]=st.pop();
      if(done){ order.push(n); continue; }
      st.push([n,true]);
      const k=kidsOf(n);
      for(let i=k.length-1;i>=0;i--) st.push([k[i],false]);
    }
  }
  for(const n of order){
    const w=N[n].w, kids=kidsOf(n);
    if(!kids.length){ L[n]=R[n]=w/2; offs[n]=[]; continue; }
    let cur=0; const centers=[];
    for(const k of kids){ centers.push(cur+L[k]); cur+=L[k]+R[k]+PAD; }
    const right=centers[centers.length-1]+R[kids[kids.length-1]];
    const mid=(centers[0]+centers[centers.length-1])/2;
    offs[n]=centers.map(c=>c-mid);
    // A parent wider than its children's span still has to fit inside the subtree's
    // footprint, so each extent takes whichever of the two reaches further.
    L[n]=Math.max(w/2,mid); R[n]=Math.max(w/2,right-mid);
  }
  const pos={}, vis=new Set();
  let cursor=MARGIN, maxX=0, maxY=0;
  for(const r of ROOTS){
    const st=[[r,cursor+L[r],0]];
    while(st.length){
      const [n,x,d]=st.pop();
      pos[n]=[x,MARGIN+d*ROW_H]; vis.add(n);
      maxX=Math.max(maxX,x+N[n].w/2); maxY=Math.max(maxY,MARGIN+d*ROW_H+N[n].h/2);
      const kids=kidsOf(n);
      kids.forEach((k,i)=>st.push([k,x+offs[n][i],d+1]));
    }
    cursor+=L[r]+R[r]+PAD*4;
  }
  return {pos, vis, W:maxX+MARGIN, H:maxY+MARGIN};
}

/* The shipped layout can't be exercised outside a browser, so it re-checks itself here:
   every parent must sit on its children's midpoint, and no two boxes in one generation may
   overlap. Together those are what stop a niece landing under an aunt. */
function selfCheck(pos, vis){
  const bad=[];
  let drift=0;
  for(const id of vis){
    const kids=kidsOf(id).filter(k=>vis.has(k));
    if(!kids.length) continue;
    const xs=kids.map(k=>pos[k][0]);
    drift=Math.max(drift, Math.abs(pos[id][0]-(Math.min(...xs)+Math.max(...xs))/2));
  }
  if(drift>0.01) bad.push('parent centring off by '+drift.toFixed(2)+'px');
  const byRow={};
  for(const id of vis){
    (byRow[pos[id][1]] = byRow[pos[id][1]] || []).push([pos[id][0]-N[id].w/2, pos[id][0]+N[id].w/2]);
  }
  let ov=0;
  for(const y in byRow){
    const b=byRow[y].sort((a,c)=>a[0]-c[0]);
    for(let i=1;i<b.length;i++) if(b[i][0] < b[i-1][1]-0.01) ov++;
  }
  if(ov) bad.push(ov+' overlapping boxes');
  const w=document.getElementById('warn');
  w.style.display = bad.length ? 'block' : 'none';
  w.textContent = bad.length ? 'Layout problem: '+bad.join('; ') : '';
}

/* ---- draw ---- */
function nodeSvg(id){
  const nd=N[id], [cx,cy]=POS[id], w=nd.w, h=nd.h;
  let s=`<g class="node" id="n_${id}" data-id="${id}" transform="translate(${cx.toFixed(1)},${cy.toFixed(1)})" tabindex="0" role="button">`;
  s+=`<rect class="cbox" x="${(-w/2).toFixed(1)}" y="${(-h/2).toFixed(1)}" width="${w}" height="${h}" rx="11"/>`;
  const top=-h/2+13;
  nd.r.forEach((r,i)=>{
    const ry=top+i*24;
    const sc = r.s==='M'?'sx-m':(r.s==='F'?'sx-f':'sx-u');
    if(i) s+=`<line class="rowdiv" x1="${(-w/2+8).toFixed(1)}" y1="${(ry-2).toFixed(1)}" x2="${(w/2-8).toFixed(1)}" y2="${(ry-2).toFixed(1)}"/>`;
    s+=`<rect class="chip ${sc}" x="${(-w/2+7).toFixed(1)}" y="${(ry+4).toFixed(1)}" width="4" height="14" rx="2"/>`;
    s+=`<text class="nm${r.b?' blood':''}" x="${(-w/2+18).toFixed(1)}" y="${(ry+13).toFixed(1)}" dominant-baseline="middle">${r.n}</text>`;
    if(r.y) s+=`<text class="yr" x="${(w/2-10).toFixed(1)}" y="${(ry+13).toFixed(1)}" text-anchor="end" dominant-baseline="middle">${r.y}</text>`;
  });
  if(nd.k.length){
    const shut=collapsed.has(id);
    s+=`<g class="tog${shut?' shut':''}" data-tog="${id}" transform="translate(0,${(h/2).toFixed(1)})">`;
    if(shut){
      const t='+'+nd.d, tw=Math.max(26, t.length*7+14);
      s+=`<rect x="${(-tw/2).toFixed(1)}" y="-9" width="${tw}" height="18" rx="9"/><text y="1">${t}</text>`;
    } else {
      s+=`<circle r="9"/><text y="1">&#8722;</text>`;
    }
    s+=`</g>`;
  }
  return s+'</g>';
}

function linkSvg(id){
  const nd=N[id];
  if(collapsed.has(id) || !nd.k.length) return '';
  const [cx,cy]=POS[id], h=nd.h;
  let s=`<g class="link" data-parent="${id}">`;
  for(const g of nd.g){
    const kids=g.k.filter(k=>VIS.has(k));
    if(!kids.length) continue;
    const bus = cy+h/2+(ROW_H-h/2-N[kids[0]].h/2)*0.52;
    const xs=kids.map(k=>POS[k][0]);
    const x1=Math.min(...xs), x2=Math.max(...xs);
    // The rail stretches to reach the parent when a group sits entirely to one side, so a
    // bracket is always physically joined to the couple it belongs to.
    const bx1=Math.min(x1,cx), bx2=Math.max(x2,cx);
    s+=`<line class="ln" x1="${cx.toFixed(1)}" y1="${(cy+h/2).toFixed(1)}" x2="${cx.toFixed(1)}" y2="${bus.toFixed(1)}"/>`;
    s+=`<line class="ln" x1="${bx1.toFixed(1)}" y1="${bus.toFixed(1)}" x2="${bx2.toFixed(1)}" y2="${bus.toFixed(1)}"/>`;
    s+=`<line class="ln" x1="${x1.toFixed(1)}" y1="${bus.toFixed(1)}" x2="${x1.toFixed(1)}" y2="${(bus-7).toFixed(1)}"/>`;
    s+=`<line class="ln" x1="${x2.toFixed(1)}" y1="${bus.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${(bus-7).toFixed(1)}"/>`;
    for(const k of kids){
      s+=`<line class="ln" x1="${POS[k][0].toFixed(1)}" y1="${bus.toFixed(1)}" x2="${POS[k][0].toFixed(1)}" y2="${(POS[k][1]-N[k].h/2).toFixed(1)}"/>`;
    }
    const lx=(x1+x2)/2;
    s+=`<g class="grplabel"><rect x="${(lx-g.lw/2).toFixed(1)}" y="${(bus-9).toFixed(1)}" width="${g.lw}" height="18" rx="9"/>`;
    s+=`<text x="${lx.toFixed(1)}" y="${(bus+1).toFixed(1)}" text-anchor="middle" dominant-baseline="middle">${g.lab}</text></g>`;
  }
  return s+'</g>';
}

function draw(){
  const {pos,vis,W,H}=computeLayout();
  POS=pos; VIS=vis; BW=W; BH=H;
  selfCheck(pos,vis);
  const ids=[...vis];
  svg.setAttribute('viewBox',`0 0 ${W.toFixed(0)} ${H.toFixed(0)}`);
  svg.innerHTML = '<g id="links">'+ids.map(linkSvg).join('')+'</g>'
                + '<g id="nodes">'+ids.map(nodeSvg).join('')+'</g>';
  applyZoom();
  if(focused && vis.has(focused)) paintFocus(focused); else focused=null;
}

/* ---- zoom / pan ---- */
function applyZoom(){
  svg.setAttribute('width',(BW*zoom).toFixed(0));
  svg.setAttribute('height',(BH*zoom).toFixed(0));
  svg.classList.toggle('lod0', zoom<0.30);
  svg.classList.toggle('lod1', zoom>=0.30 && zoom<0.55);
  document.getElementById('zl').textContent=Math.round(zoom*100)+'%';
}
function setZoom(z,anchor){
  const old=zoom;
  zoom=Math.max(0.02,Math.min(3,z));
  // Keep whatever sits mid-viewport pinned there while scaling, so zooming reads as moving
  // a lens rather than being teleported.
  const ax=anchor?anchor.x:(scroll.scrollLeft+scroll.clientWidth/2)/old;
  const ay=anchor?anchor.y:(scroll.scrollTop+scroll.clientHeight/2)/old;
  applyZoom();
  scroll.scrollLeft=ax*zoom-scroll.clientWidth/2;
  scroll.scrollTop =ay*zoom-scroll.clientHeight/2;
}
const nudge = d => setZoom(zoom*(d>0?1.25:1/1.25));
function fit(){ setZoom(Math.min(scroll.clientWidth/BW, scroll.clientHeight/BH)*0.94,{x:BW/2,y:BH/2}); }
function centerOn(id){
  if(!POS[id]) return;
  scroll.scrollLeft=POS[id][0]*zoom-scroll.clientWidth/2;
  scroll.scrollTop =POS[id][1]*zoom-scroll.clientHeight/2;
}

/* ---- focus ---- */
function paintFocus(id){
  svg.querySelectorAll('.focused,.ancestor').forEach(n=>n.classList.remove('focused','ancestor'));
  svg.querySelectorAll('.link.lit').forEach(l=>l.classList.remove('lit'));
  const g=document.getElementById('n_'+id);
  if(!g) return;
  g.classList.add('focused');
  g.parentNode.appendChild(g);            // SVG has no z-index; last sibling paints on top
  for(let c=N[id].P; c; c=N[c].P){
    const lk=svg.querySelector('.link[data-parent="'+c+'"]');
    if(lk){ lk.classList.add('lit'); lk.parentNode.appendChild(lk); }
    const pg=document.getElementById('n_'+c);
    if(pg) pg.classList.add('ancestor');
  }
  const own=svg.querySelector('.link[data-parent="'+id+'"]');
  if(own){ own.classList.add('lit'); own.parentNode.appendChild(own); }
}
function focusOn(id,zoomIn){
  focused=id; paintFocus(id);
  if(zoomIn && zoom<0.75) setZoom(0.9);
  centerOn(id);
}
function goRoot(){ collapsed.clear(); draw(); focusOn(ROOTS[0],true); }

/* Folding everything that is neither an ancestor nor a descendant of the focused couple.
   Their aunts and uncles stay on the page as folded boxes, so the line keeps its context
   instead of the rest of the family vanishing. */
function isolate(){
  if(!focused){ alert('Click a couple first, then isolate their line.'); return; }
  const keep=new Set();
  for(let c=focused;c;c=N[c].P) keep.add(c);
  (function walk(n){ keep.add(n); N[n].k.forEach(walk); })(focused);
  collapsed.clear();
  for(const id in N) if(N[id].k.length && !keep.has(id)) collapsed.add(id);
  draw(); centerOn(focused);
}
function expandAll(){ collapsed.clear(); draw(); if(focused) centerOn(focused); }
function collapseAll(){
  for(const id in N) if(N[id].k.length) collapsed.add(id);
  draw(); fit();
}

svg.addEventListener('click', e=>{
  const tog=e.target.closest('.tog');
  if(tog){
    const id=tog.dataset.tog;
    collapsed.has(id) ? collapsed.delete(id) : collapsed.add(id);
    draw(); centerOn(id);
    return;
  }
  const node=e.target.closest('.node');
  if(node) focusOn(node.dataset.id,true);
});
svg.addEventListener('keydown', e=>{
  const node=e.target.closest('.node');
  if(node && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); focusOn(node.dataset.id,true); }
});

let drag=false,sx=0,sy=0,sl=0,st=0;
scroll.addEventListener('pointerdown',e=>{
  if(e.target.closest('.node')||e.target.closest('.tog')) return;
  drag=true; sx=e.clientX; sy=e.clientY; sl=scroll.scrollLeft; st=scroll.scrollTop;
  scroll.classList.add('drag'); scroll.setPointerCapture(e.pointerId);
});
scroll.addEventListener('pointermove',e=>{
  if(!drag) return;
  scroll.scrollLeft=sl-(e.clientX-sx); scroll.scrollTop=st-(e.clientY-sy);
});
['pointerup','pointercancel'].forEach(ev=>scroll.addEventListener(ev,()=>{
  drag=false; scroll.classList.remove('drag');
}));
scroll.addEventListener('wheel',e=>{
  if(!(e.ctrlKey||e.metaKey)) return;
  e.preventDefault();
  const r=scroll.getBoundingClientRect();
  setZoom(zoom*(e.deltaY<0?1.12:1/1.12),{
    x:(scroll.scrollLeft+e.clientX-r.left)/zoom,
    y:(scroll.scrollTop +e.clientY-r.top )/zoom
  });
},{passive:false});

function sizeChrome(){
  const top=document.querySelector('.toolbar').offsetHeight
          + document.querySelector('.hint').offsetHeight
          + document.getElementById('warn').offsetHeight;
  document.documentElement.style.setProperty('--chrome',top+'px');
}
addEventListener('resize',sizeChrome);
sizeChrome();
draw();
fit();
