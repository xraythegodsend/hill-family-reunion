<!doctype html>

<head>
<meta charset="utf-8">
<title>The Hill Family Tree</title>
<style>
  :root {
    --bg: #fafafa; --text: #222; --muted: #555; --border: #999; --accent: #f0ad4e;
    --male: #dbe9f6; --male-border: #5b8fc7; --female: #f7dbe6; --female-border: #c76b95;
    --neutral: #eaeaea; --neutral-border: #888; --glow: #ffc400;
    --btn-bg: #fff; --btn-border: #ccc; --btn-hover-bg: #f0f0f0; --btn-text: #222;
    --ring: rgba(0,0,0,0.08);
    --toggle-bg: #fff; --toggle-border: #888; --toggle-hover-bg: #eef4fb;
    --toggle-hover-border: #5b8fc7; --toggle-label: #555;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1e1e1e; --text: #eee; --muted: #bbb;
      --btn-bg: #333; --btn-border: #555; --btn-hover-bg: #444; --btn-text: #eee;
      --ring: rgba(255,255,255,0.08);
      --toggle-bg: #2a2a2a; --toggle-hover-bg: #333; --toggle-hover-border: #7fb0e6;
      --toggle-label: #ccc;
    }
  }
  body { margin: 0; font-family: -apple-system, Segoe UI, Arial, sans-serif; background: var(--bg); }
  .toolbar { display: flex; align-items: center; gap: 16px; padding: 20px 28px 4px; flex-wrap: wrap; }
  h1 { font-size: 18px; margin: 0; color: var(--text); flex: 1; }
  .zoom-controls { display: flex; gap: 10px; flex-wrap: wrap; }
  .zoom-controls button {
    font-size: 20px; min-width: 52px; height: 52px; padding: 0 20px; border-radius: 10px;
    border: 1px solid var(--btn-border); background: var(--btn-bg); color: var(--btn-text);
    cursor: pointer;
  }
  .zoom-controls button:hover { background: var(--btn-hover-bg); }
  .tree-wrap {
    width: 100%; height: calc(100vh - 76px); overflow: auto; padding: 16px; box-sizing: border-box;
    display: flex; justify-content: center; align-items: flex-start;
  }
  svg { display: block; transform-origin: 0 0; flex-shrink: 0; }
  .ring-guide { fill: none; stroke: var(--ring); stroke-width: 1; }
  .ring-label {
    font-size: 11px; fill: var(--muted); letter-spacing: 0.1em; text-transform: uppercase;
  }
  .name { font-size: 11px; fill: var(--text); }
  .person { cursor: pointer; }
  .sex-m rect { fill: var(--male); stroke: var(--male-border); stroke-width: 1.25; }
  .sex-f rect { fill: var(--female); stroke: var(--female-border); stroke-width: 1.25; }
  .sex-u rect { fill: var(--neutral); stroke: var(--neutral-border); stroke-width: 1.25; }
  .union-line { stroke: var(--border); stroke-width: 1; opacity: 0.6; }
  .descent-line {
    stroke: var(--border); stroke-width: 1.5;
    transition: stroke 0.15s ease, stroke-width 0.15s ease;
  }
  .descent-group.glow .descent-line {
    stroke: var(--glow); stroke-width: 3; filter: drop-shadow(0 0 3px var(--glow));
  }
  .toggle { cursor: pointer; }
  .toggle-circle { fill: var(--toggle-bg); stroke: var(--toggle-border); stroke-width: 1.5; }
  .toggle:hover .toggle-circle { fill: var(--toggle-hover-bg); stroke: var(--toggle-hover-border); }
  .toggle-label { font-size: 11px; font-weight: 700; fill: var(--toggle-label); user-select: none; }
</style>

    canvas.style.width = (baseW * zoom) + 'px';
    canvas.style.height = (baseH * zoom) + 'px';

  function highlightChildren(pid, evt) {
    if (evt) evt.stopPropagation();

      g.classList.remove('glow');
    });
    document.querySelectorAll('.descent-group').forEach(function(g) {
      var ids = (g.getAttribute('data-parent-ids') || '').split(',');
      if (ids.indexOf(pid) !== -1) g.classList.add('glow');

    var nowOpen = !firstGroup || firstGroup.style.display === 'none';

  }

  function setAllSubtrees(open) {
    document.querySelectorAll('.subtree').forEach(function(g) {
      g.style.display = open ? 'block' : 'none';
    });
    document.querySelectorAll('.toggle .toggle-label').forEach(function(label) {
      label.textContent = open ? '−' : '+';
    });
  }

      g.style.display = defaultOpenIds.indexOf(g.id) !== -1 ? 'block' : 'none';
    });
    document.querySelectorAll('.toggle').forEach(function(t) {
