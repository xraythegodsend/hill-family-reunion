<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>The Hill Family Tree</title>
<style>
  :root {
    --bg: #fafafa; --card-bg: #fff; --text: #222; --muted: #666; --border: #ddd;
    --accent: #5b8fc7; --male: #dbe9f6; --male-border: #5b8fc7;
    --female: #f7dbe6; --female-border: #c76b95; --neutral: #eaeaea; --neutral-border: #999;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a1a; --card-bg: #262626; --text: #eee; --muted: #aaa; --border: #444;
      --accent: #7fb0e6; --male: #274156; --male-border: #7fb0e6;
      --female: #4a2c38; --female-border: #e69ac2; --neutral: #333; --neutral-border: #888;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, Segoe UI, Arial, sans-serif; background: var(--bg);
    color: var(--text);
  }
  .toolbar { padding: 16px 24px 8px; }
  h1 { font-size: 18px; margin: 0 0 10px; }
  .breadcrumb { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 14px; }
  .breadcrumb button {
    background: none; border: none; color: var(--accent); cursor: pointer; font-size: 14px;
    padding: 4px 6px; border-radius: 4px; text-decoration: none;
  }
  .breadcrumb button:hover { background: var(--card-bg); text-decoration: underline; }
  .breadcrumb button.current { color: var(--text); font-weight: 600; cursor: default; }
  .breadcrumb button.current:hover { background: none; text-decoration: none; }
  .breadcrumb .sep { color: var(--muted); }
  .content { max-width: 720px; margin: 0 auto; padding: 8px 24px 48px; }
  .focus-card {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px;
    padding: 20px; margin-bottom: 20px;
  }
  .person-line { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .person-name { font-size: 20px; font-weight: 700; }
  .person-years { color: var(--muted); font-size: 14px; }
  .maiden-name { color: var(--muted); font-size: 13px; font-style: italic; margin-top: 2px; }
  .low-conf { border-style: dashed !important; }
  .conf-flag { color: #c98a2b; font-size: 13px; font-weight: 600; }
  .spouse-row {
    margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--border);
    display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap;
  }
  .spouse-row::before { content: "\2661"; color: var(--accent); font-size: 14px; }
  .spouse-name { font-size: 17px; font-weight: 600; }
  .spouse-detail { color: var(--muted); font-size: 14px; }
  .notes { margin-top: 12px; font-size: 13px; color: var(--muted); white-space: pre-wrap; }
  .section-title {
    font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted);
    margin: 24px 0 8px;
  }
  .child-list { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; }
  @media (max-width: 560px) {
    .child-list { grid-template-columns: 1fr; }
  }
  .child-row {
    display: flex; align-items: center; gap: 10px; background: var(--card-bg);
    border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; cursor: pointer;
    text-align: left; width: 100%; font: inherit; color: inherit; min-width: 0;
  }
  .child-row .info { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .branch-icon { flex-shrink: 0; color: var(--accent); opacity: 0.75; }
  .child-row:hover { border-color: var(--accent); }
  .child-row .swatch { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .child-row .info { flex: 1; }
  .child-row .chevron { color: var(--muted); }
  .empty-msg { color: var(--muted); font-size: 14px; padding: 8px 0 0; }
  .root-picker .child-row { padding: 16px; }
</style>
<style>
/* Hill Family Reunion theme for render_explorer.py's output.
   Matches the palette and type system of hill-family-reunion.html so the embedded explorer
   reads as part of the same site rather than a bolted-on tool. Commits to the reunion site's
   single dark look rather than adapting to the viewer's OS theme, since the reunion page
   itself doesn't offer a light mode. */

@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Raleway:wght@300;400;500;600&display=swap');

:root {
  --bg: #062828;

}

body {
  font-family: 'Libre Baskerville', serif;
}

.toolbar {
  padding: 20px 24px 12px;
  border-bottom: 1px solid var(--border);
}

h1 {
  font-family: 'Cormorant Garamond', serif;

  font-size: 1.7rem;

}

.breadcrumb {

  font-size: 0.72rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
.breadcrumb button {
  color: var(--muted);
}
.breadcrumb button:hover {
  background: rgba(255,107,53,0.1);
  color: var(--accent);
}
.breadcrumb button.current {
  color: var(--accent);
}
.breadcrumb button.current:hover {
  background: none;
}

.focus-card {
  border-radius: 2px;
  border: 1px solid var(--border);
  position: relative;
  overflow: hidden;
  padding: 28px 28px 24px;
}
.focus-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 3px;
  background: var(--accent);
}

.person-name {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 400;
  font-size: 1.7rem;
  color: #FFFFFF;
}
.person-years, .spouse-detail {
  font-family: 'Raleway', sans-serif;
  letter-spacing: 0.08em;
}
.maiden-name {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 0.95rem;
}
.conf-flag {
  font-family: 'Raleway', sans-serif;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  font-size: 0.68rem;
  color: var(--accent);
}

.spouse-row {
  border-top: 1px solid var(--border);
}
.spouse-row::before {
  color: var(--accent);
}
.spouse-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.15rem;
  font-weight: 400;
  color: #FFFFFF;
}

.notes {
  font-family: 'Libre Baskerville', serif;
  font-style: italic;
  line-height: 1.7;
  color: var(--text);
  opacity: 0.85;
}

.section-title {
  font-family: 'Raleway', sans-serif;
  font-size: 0.7rem;
  letter-spacing: 0.3em;
  color: var(--accent);
  display: flex;
  align-items: center;
  gap: 14px;
}
.section-title::after {
  content: '';
  flex: 1;
  max-width: 60px;
  height: 1px;
  background: var(--accent);
  opacity: 0.4;
}

.child-row {
  border-radius: 2px;
  background: rgba(255,255,255,0.02);
  transition: border-color 0.2s ease, background 0.2s ease, transform 0.2s ease;
}
.child-row:hover {
  background: rgba(255,107,53,0.08);
  transform: translateY(-1px);
}
.child-row .info {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.05rem;
  color: var(--text);
}
.branch-icon {
  color: var(--accent);
}
.child-row .chevron {
  color: var(--muted);
}

.empty-msg {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
}

.root-picker .child-row {
  border-color: rgba(255,184,48,0.4);
}

/* ===== render_tree.py (the full SVG diagram) ===== */

.zoom-controls button {
  font-family: 'Raleway', sans-serif;
  font-size: 0.68rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  border-radius: 2px;
  border-color: var(--border);
}
.zoom-controls button:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.name {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 400;
  font-size: 15px;
}
.years {
  font-family: 'Raleway', sans-serif;
  letter-spacing: 0.06em;
}

.sex-m rect, .sex-f rect, .sex-u rect {
  stroke-width: 1.25;
}

.toggle-circle {
  stroke-width: 1.25;
}
.toggle-label {
  font-family: 'Raleway', sans-serif;
}

</style>

Kirkland", "marriedName": null, "sex": "M", "years": "", "confidence": "medium", "notes": "Surname only; given name not recorded."}, "earl_hill": {"id": "earl_hill", "name": "Earl Hill", "marriedName": null, "sex": "M", "years": "", "confidence": "high", "notes": "Reunion Book 2024 working.docx: started as a caddie on Jekyll Island at age 9, becoming a well-known caddie/bag carrier among the Jekyll Island Club's millionaires in the 1920s. Used his sports and music connections (including Jim Brown) to connect with Atlanta preachers toward desegregating golf in Georgia; after the 1964 court ruling desegregating the state-owned island, he created The Southeastern Golf Tournament (\"The Classic\"), featuring golfers Lee Elder, Calvin Peete, and Jim Thorpe, and organized the island's first desegregated concerts (Jerry Butler, Wilson Pickett, Otis Redding, Percy Sledge, and others).\n"}, "matilda_hill": {"id": "matilda_hill", "name": "Matilda", "marriedName": "Matilda Hill", "sex": "F", "years": "", "confidence": "high", "notes": "Reunion Book 2024 working.docx (\"Matilda Denegal Hill\"): lived on Jekyll Island as a child; daughter of Sam Denegal, known as \"the Foreman of the Forest\" for overseeing 25+ men clearing/maintaining roads on Jekyll Island (a road was named after him) and well liked by the Jekyll Island Club's millionaire members for his dependability, earning $500/year in tips. Sam was a Deacon at the black employee church and owned the island's only grocery store, near his home; his brother Walter Denegal was accidentally shot and killed by a Jekyll Island Club member (Mr. Clark) in the late 1920s while digging up turtle eggs on the beach at night, having gone on the wrong night (turtle-egg-gathering nights were for employees; hog-hunting nights were for Club members). Sam and Walter are not otherwise documented in these sources and aren't given their own tree records here. Matilda herself was hired as a housekeeper by an employer in the Rockefeller cottages  "joe_williams_jr", "melissa_williams", "michael_williams_teresa_son"]}], "teresa_cash": [{"partner": "joe_williams_husband_of_teresa", "children": ["teikoa_williams", "joe_williams_jr", "melissa_williams", "michael_williams_teresa_son"]}], "david_washington": [{"partner": "teikoa_williams", "children": ["kierra_washington", "zavier_washington"]}], "teikoa_williams": [{"partner": "david_washington", "children": ["kierra_washington", "zavier_washington"]}], "joe_williams_jr": [{"partner": null, "children": ["jominite_williams", "prince_williams"]}], "melissa_williams": [{"partner": null, "children": ["aniah_williams", "sanan_williams"]}], "michael_williams_teresa_son": [{"partner": null, "children": ["samaj_williams", "mahki_williams"]}]}, "rootGroups": [["aaron_hill_1838", "mary_ann_pinckney_1848"]]};
  let path = [];
  // A small "branches further" glyph — one node splitting into two below it — shown on
  // any row whose person has their own children, instead of a "has children" text label.
  const BRANCH_ICON_SVG = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">' +
    '<circle cx="12" cy="5" r="3" fill="currentColor"/>' +
    '<path d="M12 8V12M12 12L6 16M12 12L18 16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>' +
    '<circle cx="6" cy="19" r="3" fill="currentColor"/>' +
    '<circle cx="18" cy="19" r="3" fill="currentColor"/>' +
    '</svg>';

  function swatchColor(sex) {
    if (sex === 'M') return 'var(--male-border)';
    if (sex === 'F') return 'var(--female-border)';
    return 'var(--neutral-border)';
  }
  function fillColor(sex) {
    if (sex === 'M') return 'var(--male)';
    if (sex === 'F') return 'var(--female)';
    return 'var(--neutral)';
  }

  function personLabel(p) {
    return p.name + (p.confidence === 'low' ? ' ?' : '');
  }

  // The focus card leads with a married name when one is recorded (data-schema.md's
  // married_name field) rather than the maiden name used everywhere else (breadcrumb,
  // children lists) — those other spots are about identifying someone as "so-and-so's
  // child," where the maiden/birth surname is what ties them to their parents' record.
  function focusDisplayName(p) {
    return (p.marriedName || p.name) + (p.confidence === 'low' ? ' ?' : '');
  }

  function renderBreadcrumb() {
    const el = document.getElementById('breadcrumb');
    el.innerHTML = '';
    const homeBtn = document.createElement('button');
    homeBtn.textContent = 'Home';
    homeBtn.className = path.length === 0 ? 'current' : '';
    homeBtn.onclick = function() { path = []; render(); };
    el.appendChild(homeBtn);
    path.forEach(function(pid, i) {
      const sep = document.createElement('span');
      sep.className = 'sep';
      sep.textContent = ' \u203a ';
      el.appendChild(sep);
      const btn = document.createElement('button');
      btn.textContent = DATA.people[pid] ? DATA.people[pid].name : pid;
      btn.className = (i === path.length - 1) ? 'current' : '';
      btn.onclick = function() { path = path.slice(0, i + 1); render(); };
      el.appendChild(btn);
    });
  }

  function spousesOf(pid) {
    return (DATA.spouses[pid] || []).map(function(s) { return s.id; });
  }

  function renderFocusCard(pid) {
    const p = DATA.people[pid];
    const wrap = document.createElement('div');
    wrap.className = 'focus-card';
    const line = document.createElement('div');
    line.className = 'person-line';
    const swatch = document.createElement('span');
    swatch.className = 'swatch';
    swatch.style.cssText = 'display:inline-block;width:12px;height:12px;border-radius:50%;background:' + fillColor(p.sex) + ';border:2px solid ' + swatchColor(p.sex);
    line.appendChild(swatch);
    const nameEl = document.createElement('span');
    nameEl.className = 'person-name';
    nameEl.textContent = focusDisplayName(p);
    line.appendChild(nameEl);
    if (p.years) {
      const yearsEl = document.createElement('span');
      yearsEl.className = 'person-years';
      yearsEl.textContent = p.years;
      line.appendChild(yearsEl);
    }
    if (p.confidence === 'low') {
      const flag = document.createElement('span');
      flag.className = 'conf-flag';
      flag.textContent = 'unconfirmed';
      line.appendChild(flag);
    }
    wrap.appendChild(line);

    if (p.marriedName) {
      const maiden = document.createElement('div');
      maiden.className = 'maiden-name';
      maiden.textContent = 'née ' + p.name;
      wrap.appendChild(maiden);
    }

    (DATA.spouses[pid] || []).forEach(function(s) {
      const sp = DATA.people[s.id];
      if (!sp) return;
      const row = document.createElement('div');
      row.className = 'spouse-row';
      const spouseName = document.createElement('span');
      spouseName.className = 'spouse-name';
      spouseName.textContent = personLabel(sp) + (sp.years ? ' (' + sp.years + ')' : '');
      row.appendChild(spouseName);
      let detail = '';
      if (s.marriage_date) detail += 'm. ' + s.marriage_date;
      if (s.marriage_place) detail += (detail ? ', ' : '') + s.marriage_place;
      if (detail) {
        const detailEl = document.createElement('span');
        detailEl.className = 'spouse-detail';
        detailEl.textContent = ' \u2014 ' + detail;
        row.appendChild(detailEl);
      }
      wrap.appendChild(row);
    });

    if (p.notes) {
      const notes = document.createElement('div');
      notes.className = 'notes';
      notes.textContent = p.notes;
      wrap.appendChild(notes);
    }
    return wrap;
  }

  function renderChildRow(childId) {
    const p = DATA.people[childId];
    const btn = document.createElement('button');
    btn.className = 'child-row';
    if (p.confidence === 'low') btn.classList.add('low-conf');
    const swatch = document.createElement('span');
    swatch.className = 'swatch';
    swatch.style.background = fillColor(p.sex);
    swatch.style.border = '2px solid ' + swatchColor(p.sex);
    btn.appendChild(swatch);
    const info = document.createElement('span');
    info.className = 'info';
    const hasKids = !!(DATA.childrenByPerson[childId] && DATA.childrenByPerson[childId].length);
    info.textContent = personLabel(p) + (p.years ? '  \u00b7  ' + p.years : '');
    btn.appendChild(info);
    if (hasKids) {
      const branch = document.createElement('span');
      branch.className = 'branch-icon';
      branch.title = 'Has children';
      branch.innerHTML = BRANCH_ICON_SVG;
      btn.appendChild(branch);
    }
    const chevron = document.createElement('span');
    chevron.className = 'chevron';
    chevron.textContent = '\u203a';
    btn.appendChild(chevron);
    btn.onclick = function() { path.push(childId); render(); };
    return btn;
  }

  function renderChildrenSections(pid) {
    const groups = DATA.childrenByPerson[pid] || [];
    const container = document.createElement('div');
    if (groups.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty-msg';
      empty.textContent = 'No children recorded.';
      container.appendChild(empty);
      return container;
    }
    groups.forEach(function(group) {
      const title = document.createElement('div');
      title.className = 'section-title';
      if (group.partner && DATA.people[group.partner]) {
        title.textContent = 'Children with ' + DATA.people[group.partner].name;
      } else {
        title.textContent = 'Children';
      }
      container.appendChild(title);
      const list = document.createElement('div');
      list.className = 'child-list';
      group.children.forEach(function(cid) {
        if (DATA.people[cid]) list.appendChild(renderChildRow(cid));
      });
      container.appendChild(list);
    });
    return container;
  }

  function renderRootPicker() {
    const container = document.createElement('div');
    const title = document.createElement('div');
    title.className = 'section-title';
    title.textContent = 'Choose a starting point';
    container.appendChild(title);
    const list = document.createElement('div');
    list.className = 'child-list root-picker';
    DATA.rootGroups.forEach(function(group) {
      const leadId = group[0];
      const lead = DATA.people[leadId];
      if (!lead) return;
      const btn = document.createElement('button');
      btn.className = 'child-row';
      const label = group.map(function(id) { return DATA.people[id] ? DATA.people[id].name : id; }).join(' & ');
      const info = document.createElement('span');
      info.className = 'info';
      info.textContent = label;
      btn.appendChild(info);
      const chevron = document.createElement('span');
      chevron.className = 'chevron';
      chevron.textContent = '\u203a';
      btn.appendChild(chevron);
      btn.onclick = function() { path.push(leadId); render(); };
      list.appendChild(btn);
    });
    container.appendChild(list);
    return container;
  }

  function render() {
    renderBreadcrumb();
    const content = document.getElementById('content');
    content.innerHTML = '';
    if (path.length === 0) {
      if (DATA.rootGroups.length === 1) {
        path.push(DATA.rootGroups[0][0]);
      } else {
        content.appendChild(renderRootPicker());
        return;
      }
    }
    const pid = path[path.length - 1];
    content.appendChild(renderFocusCard(pid));
    content.appendChild(renderChildrenSections(pid));
  }

  render();
</script>
