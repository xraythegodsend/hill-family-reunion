  - id: earl_hill
    name: Earl Hill
    sex: M
    parents: [myers_hill_1883, onie_miller]
    spouses:
      - id: matilda_hill
    notes: >
      Reunion Book 2024 working.docx: started as a caddie on Jekyll Island at age 9, becoming a
      well-known caddie/bag carrier among the Jekyll Island Club's millionaires in the 1920s.
      Used his sports and music connections (including Jim Brown) to connect with Atlanta
      preachers toward desegregating golf in Georgia; after the 1964 court ruling desegregating
      the state-owned island, he created The Southeastern Golf Tournament ("The Classic"),
      featuring golfers Lee Elder, Calvin Peete, and Jim Thorpe, and organized the island's first
      desegregated concerts (Jerry Butler, Wilson Pickett, Otis Redding, Percy Sledge, and
      others).
    confidence: high

  - id: matilda_hill
    name: Matilda
    married_name: Matilda Hill
    sex: F
    notes: >
      Reunion Book 2024 working.docx ("Matilda Denegal Hill"): lived on Jekyll Island as a
      child; daughter of Sam Denegal, known as "the Foreman of the Forest" for overseeing 25+ men
      clearing/maintaining roads on Jekyll Island (a road was named after him) and well liked by
      the Jekyll Island Club's millionaire members for his dependability, earning $500/year in
      tips. Sam was a Deacon at the black employee church and owned the island's only grocery
      store, near his home; his brother Walter Denegal was accidentally shot and killed by a
      Jekyll Island Club member (Mr. Clark) in the late 1920s while digging up turtle eggs on the
      beach at night, having gone on the wrong night (turtle-egg-gathering nights were for
      employees; hog-hunting nights were for Club members). Sam and Walter are not otherwise
      documented in these sources and aren't given their own tree records here. Matilda herself
      was hired as a housekeeper by an employer in the Rockefeller cottages after her car broke
      down in front of the Denegal family's store, and worked for that family for many years.
    confidence: high

