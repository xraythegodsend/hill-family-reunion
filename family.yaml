      date: "1925-08-28"
      source: "Reunion Book 2024 working.docx (\"W. Ray (Walter) Hill, August 28, 1925\")"
    parents: [myers_hill_1883, onie_miller]
    spouses:
      - id: myldred_hill
    notes: >
      Full given name Walter, per Reunion Book 2024 working.docx. Author of the personal
      testimony/memoir "God's Grace and Mercy Throughout My Life" (Hill, 2016). Served in the
      U.S. Army during WWII (97th Engineers Regiment, Alcan Highway survey/construction from
      Valdez, Alaska, then Oro Bay, New Guinea), discharged Dec. 26, 1945; attended Morris Brown
      College, then City College of New York, then NY Technical Institute; worked as personal
      manager for comedian Redd Foxx and others; had diverse later careers (mortuary science,
      private investigation, college administration, spiritual counseling, affordable housing
      development) before retiring into ministry as an AME Church Itinerant Elder and Pastor.
      Known within the family as "Uncle Ray" and referred to as the family's patriarch in family
      reunion correspondence as of 2026.
    confidence: high

