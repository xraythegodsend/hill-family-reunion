    sex: M
    birth:
      date: "1871-07-08"
      source: "HILL FAMILY TREE.pptx, slide 6 and slide 15 (both agree); month/year corroborated by Reunion Book 2024 working.docx (\"born July 1871\")"
    parents: [aaron_hill_1838, mary_ann_pinckney_1848]
    spouses:
      - id: angie_parland
    notes: >
      Reunion Book 2024 working.docx: called "the Patriarch of Jekyll Island Employees"; worked
      for the Maurice family at Hollybourne Cottage as coachman and caretaker for 51 years,
      starting as their hire in 1891; being the first local employee, he got jobs there for most
      of his family, in-laws, and friends (the source claims ~77% of the island's employees were
      connected to him in some way). Known for yelling "The Wheels are rolling at 4!" when
      bringing the stagecoach for the Maurice family. Moved back to Brunswick with his family in
      1942 when the Maurice family left the island.
    confidence: high

